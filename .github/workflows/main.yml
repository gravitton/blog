name: Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27'
  HUGO_VERSION: '0.169.0'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          curl -sSL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Code behind the posts
        run: |
          shopt -s nullglob
          for module in code/*/; do
            echo "::group::$module"
            (
              cd "$module"
              test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
              go vet ./...
              staticcheck ./...
              go run .
            )
            echo "::endgroup::"
          done

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

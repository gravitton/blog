{{ define "main" }}
<article>
  <header>
    <h1>{{ .Title }}</h1>
    <p class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{ with .Params.repository }}· <a href="{{ site.Params.github }}/{{ . }}">gravitton/{{ . }}</a>{{ end }}
      {{ if .Draft }}· <strong>draft</strong>{{ end }}
    </p>
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ partial "series.html" . }}
{{ end }}
